<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PRAETOR Intelligence | IP Protection</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Teko:wght@400;600;700&family=Roboto+Mono:wght@400;700&display=swap');
        
        :root {
            --steel: #1a1c20;
            --dark-steel: #0d0f12;
            --neon-cyan: #00f3ff;
            --text-main: #e0e6ed;
            --alert: #ff2a2a;
        }

        body {
            background-color: var(--dark-steel);
            color: var(--text-main);
            font-family: 'Roboto Mono', monospace;
            margin: 0;
            padding: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            background-image: linear-gradient(rgba(13, 15, 18, 0.9), rgba(13, 15, 18, 0.9)), 
                              repeating-linear-gradient(45deg, transparent, transparent 2px, rgba(255,255,255,0.02) 2px, rgba(255,255,255,0.02) 4px);
        }

        .container {
            background: var(--steel);
            border: 1px solid #333;
            border-top: 4px solid var(--neon-cyan);
            padding: 40px;
            width: 100%;
            max-width: 500px;
            box-shadow: 0 0 20px rgba(0, 243, 255, 0.1);
        }

        h1 {
            font-family: 'Teko', sans-serif;
            font-size: 3rem;
            margin: 0 0 10px 0;
            color: var(--text-main);
            text-transform: uppercase;
            letter-spacing: 2px;
        }

        .highlight { color: var(--neon-cyan); }

        p { font-size: 0.9rem; margin-bottom: 30px; color: #8892b0; }

        .form-group { margin-bottom: 20px; }
        
        .score-card {
            background: rgba(0,0,0,0.2);
            border: 2px solid var(--neon-cyan);
            padding: 24px;
            border-radius: 4px;
            text-align: center;
            margin: 20px 0;
            display: none;
        }

        .score-value {
            font-size: 3.5rem;
            font-family: 'Teko', sans-serif;
            font-weight: 700;
            margin: 0;
            color: var(--neon-cyan);
        }

        .score-label {
            font-size: 0.9rem;
            color: #8892b0;
            margin: 8px 0 0 0;
        }

        .score-level {
            font-size: 1.2rem;
            font-weight: 600;
            margin: 12px 0;
            text-transform: uppercase;
            letter-spacing: 2px;
        }

        .score-level.low { color: #00ff00; }
        .score-level.medium { color: #ffff00; }
        .score-level.high { color: #ff2a2a; }

        .cta-section {
            display: none;
            margin-top: 20px;
            text-align: center;
        }

        .cta-button {
            background: var(--neon-cyan);
            color: var(--dark-steel);
            border: none;
            padding: 12px 24px;
            font-size: 0.9rem;
            font-weight: 600;
            border-radius: 4px;
            cursor: pointer;
            margin: 8px 4px;
            transition: all 0.3s ease;
            display: inline-block;
        }

        .cta-button:hover {
            background: #00d4cc;
            transform: scale(1.05);
        }

        .cta-button.secondary {
            background: transparent;
            border: 2px solid var(--neon-cyan);
            color: var(--neon-cyan);
        }

        .cta-button.secondary:hover {
            background: rgba(0, 243, 255, 0.1);
        }
        label {
            display: block;
            margin-bottom: 8px;
            font-size: 0.8rem;
            color: var(--neon-cyan);
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        input {
            width: 100%;
            padding: 12px;
            background: #0a0b0d;
            border: 1px solid #333;
            color: var(--text-main);
            font-family: 'Roboto Mono', monospace;
            box-sizing: border-box;
        }

        input:focus {
            outline: none;
            border-color: var(--neon-cyan);
            box-shadow: 0 0 8px rgba(0, 243, 255, 0.2);
        }

        button {
            width: 100%;
            padding: 15px;
            background: transparent;
            border: 2px solid var(--neon-cyan);
            color: var(--neon-cyan);
            font-family: 'Teko', sans-serif;
            font-size: 1.5rem;
            text-transform: uppercase;
            cursor: pointer;
            transition: all 0.3s ease;
            letter-spacing: 2px;
        }

        button:hover {
            background: var(--neon-cyan);
            color: var(--dark-steel);
            box-shadow: 0 0 15px var(--neon-cyan);
        }

        .status {
            margin-top: 20px;
            font-size: 0.8rem;
            color: #8892b0;
            text-align: center;
        }

        .result-section {
            margin-top: 24px;
            padding: 16px;
            background: rgba(0,0,0,0.2);
            border-left: 4px solid var(--neon-cyan);
        }

        .result-section h3 {
            margin-top: 0;
            margin-bottom: 16px;
            font-size: 1.1rem;
            color: var(--text-main);
        }

        .info-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 12px;
            margin-bottom: 12px;
        }

        .info-item {
            padding: 8px;
            background: rgba(0, 243, 255, 0.05);
            border-left: 2px solid var(--neon-cyan);
            font-size: 0.9rem;
        }

        .recommendation {
            margin-bottom: 16px;
            padding: 12px;
            border-left: 4px solid #666;
            background: rgba(0,0,0,0.3);
            border-radius: 2px;
        }

        .recommendation.critical {
            border-left-color: #ff2a2a;
        }

        .recommendation.high {
            border-left-color: #ff9800;
        }

        .recommendation.medium {
            border-left-color: #ffeb3b;
        }

        .recommendation.low {
            border-left-color: #4caf50;
        }

        .recommendation strong {
            font-size: 0.95rem;
        }

        .recommendation p {
            margin: 6px 0;
            font-size: 0.85rem;
            color: #c0c0c0;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>PRAETOR <span class="highlight">INTEL</span></h1>
        <p>AUDITORÍA FORENSE DE SUPERFICIE. PROTECCIÓN DE ACTIVOS DIGITALES E IP.</p>
        
        <form id="intelForm" onsubmit="executeScan(event)">
            <div class="form-group">
                <label for="company">Objetivo (Empresa / Marca)</label>
                <input type="text" id="company" placeholder="Ej. corporacion.com" required>
            </div>
            <div class="form-group">
                <label for="email">Contacto de Enlace</label>
                <input type="email" id="email" placeholder="ceo@empresa.com" required>
            </div>
            <button type="submit">Iniciar Escaneo Táctico</button>
        </form>
        <div id="status" class="status">SISTEMA EN ESPERA...</div>
        
        <div id="scoreCard" class="score-card">
            <p class="score-value" id="scoreValue">0</p>
            <p class="score-label">RISK SCORE</p>
            <p id="scoreLevel" class="score-level low">LOW RISK</p>
            <div id="scoreDetails" style="font-size: 0.8rem; color: #8892b0; margin-top: 12px;"></div>
        </div>

        <div id="ctaSection" class="cta-section">
            <p style="margin-bottom: 16px; font-size: 0.9rem;">¿Desea un análisis completo?</p>
            <button class="cta-button" onclick="buyReport()">💳 Descargar Reporte Completo - $29 USD</button>
            <button class="cta-button secondary" onclick="requestAudit()">📋 Solicitar Auditoría Profesional</button>
        </div>

        <div id="summary" class="status" style="text-align:left; padding: 16px; background: rgba(0,0,0,0.12); border: 1px solid #222; margin-top: 16px; display: none;"></div>
        <button id="downloadBtn" type="button" style="display:none; margin-top: 12px;" onclick="downloadReport()">Descargar JSON</button>
        <pre id="result" class="status" style="white-space: pre-wrap; word-break: break-word; max-height: 260px; overflow: auto; margin-top: 16px; display: none;"></pre>
    </div>

    <script>
        let lastScanData = null;

        async function executeScan(e) {
            e.preventDefault();
            const target = document.getElementById('company').value.trim();
            const statusBox = document.getElementById('status');
            const email = document.getElementById('email').value.trim();

            if (!target) {
                statusBox.style.color = "var(--alert)";
                statusBox.textContent = "Ingrese un dominio válido.";
                return;
            }

            statusBox.style.color = "var(--neon-cyan)";
            statusBox.innerHTML = `> INICIALIZANDO PROTOCOLOS DE RECONOCIMIENTO PARA: ${target}...<br>> ESTABLECIENDO CONEXIÓN SEGURA...`;

            try {
                const response = await fetch('/scan', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify({ domain: target, contact: email })
                });

                if (!response.ok) {
                    const error = await response.json().catch(() => ({}));
                    throw new Error(error.error || 'Error en el servidor.');
                }

                const data = await response.json();
                statusBox.style.color = "var(--text-main)";
                statusBox.innerHTML = `> SCAN COMPLETADO.`;
                
                displayScore(data);
                renderSummary(data);
                document.getElementById('downloadBtn').style.display = 'block';
            } catch (err) {
                statusBox.style.color = "var(--alert)";
                statusBox.innerHTML = `> ERROR: ${err.message}`;
                document.getElementById('result').textContent = '';
                document.getElementById('summary').style.display = 'none';
                document.getElementById('downloadBtn').style.display = 'none';
                document.getElementById('scoreCard').style.display = 'none';
                document.getElementById('ctaSection').style.display = 'none';
            }
        }

        function displayScore(data) {
            lastScanData = data;
            const scoreCard = document.getElementById('scoreCard');
            const scoreValue = document.getElementById('scoreValue');
            const scoreLevel = document.getElementById('scoreLevel');
            const scoreDetails = document.getElementById('scoreDetails');
            
            scoreValue.textContent = data.risk_score || 0;
            const level = (data.risk_level || 'Unknown').toUpperCase();
            scoreLevel.textContent = level;
            scoreLevel.className = 'score-level ' + (data.risk_level || 'unknown').toLowerCase();
            
            const components = data.risk_components || [];
            if (components.length > 0) {
                scoreDetails.innerHTML = components.map(c => `<div>${c.issue} (+${c.points})</div>`).join('');
            } else {
                scoreDetails.innerHTML = '<div>Sin hallazgos críticos</div>';
            }
            
            scoreCard.style.display = 'block';
            document.getElementById('ctaSection').style.display = 'block';
        }

        
 function buyReport() {
    window.open(
        'https://buy.stripe.com/9B628s1ICf2p7zT8775AQ00',
        '_blank'
    );
}
        function requestAudit() {
            if (!lastScanData) return;
            const email = document.getElementById('email').value || 'no@email.com';
            const domain = lastScanData.domain;
            const subject = encodeURIComponent('Solicitud de Auditoría PRAETOR');
            const body = encodeURIComponent(`Hola,%0A%0ASolicito una auditoría profesional para el dominio ${domain}.%0AContacto: ${email}%0AScore actual: ${lastScanData.risk_score}%0A%0AQuedo atento.`);
            window.location.href = `mailto:ventas@praetor.com?subject=${subject}&body=${body}`;
        }

        function renderSummary(data) {
            const summary = document.getElementById('summary');
            
            const recommendations = (data.recommendations || []).map(rec => {
                const colorClass = rec.type === 'Critical' ? 'critical' : rec.type === 'High' ? 'high' : rec.type === 'Medium' ? 'medium' : 'low';
                return `
                    <div class="recommendation ${colorClass}">
                        <strong>${rec.title}</strong>
                        <p>${rec.description}</p>
                        <p style="font-style: italic; color: #aaa;">→ ${rec.action}</p>
                    </div>
                `;
            }).join('');
            
            const spfStatus = data.spf ? '✓ Configurado' : '✗ No configurado';
            const dmarcStatus = data.dmarc ? '✓ Configurado' : '✗ No configurado';
            const sslStatus = data.ssl && data.ssl.error ? '✗ Error' : '✓ Válido';
            
            summary.innerHTML = `
                <div class="result-section">
                    <h3>📊 Resumen Ejecutivo</h3>
                    <div class="info-grid">
                        <div class="info-item"><strong>Dominio:</strong> ${data.domain || 'n/d'}</div>
                        <div class="info-item"><strong>IP:</strong> ${data.ip || 'n/d'}</div>
                        <div class="info-item"><strong>SPF:</strong> ${spfStatus}</div>
                        <div class="info-item"><strong>DMARC:</strong> ${dmarcStatus}</div>
                        <div class="info-item"><strong>SSL:</strong> ${sslStatus}</div>
                        <div class="info-item"><strong>Tecnologías:</strong> ${data.technologies && data.technologies.length ? data.technologies.join(', ') : 'No detectadas'}</div>
                    </div>
                </div>
                <div class="result-section">
                    <h3>🎯 Recomendaciones</h3>
                    ${recommendations}
                </div>
            `;
            summary.style.display = 'block';
        }
            function downloadReport() {

    const domain =
        document.getElementById('company').value.trim();

    if (!domain) {
        alert("No hay dominio escaneado.");
        return;
    }

    window.location.href =
        "/download/REPORT_" + domain + ".pdf";
}
    </script>
</body>
</html>
