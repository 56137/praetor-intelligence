name: PRAETOR Stripe Checkout tests

on:
  pull_request:
    branches: [main]
    paths:
      - "app.py"
      - "tests/**"
      - ".github/workflows/stripe-checkout-tests.yml"
  push:
    branches: [main]
    paths:
      - "app.py"
      - "tests/**"
      - ".github/workflows/stripe-checkout-tests.yml"

permissions:
  contents: read

jobs:
  stripe-checkout-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install Flask flask-cors stripe

      - name: Run Stripe Checkout regression tests
        run: python -m unittest discover -s tests -v
