name: PRAETOR Production Smoke + Lead Batch Scan

on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout PRAETOR
        uses: actions/checkout@v4

      - name: Configure Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install scanner dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install --no-cache-dir requests dnspython openpyxl reportlab

      - name: Create new-lead domain list
        run: |
          cat > dominios_nuevos.txt <<'EOF'
          kueski.com
          clip.mx
          konfio.mx
          bitso.com
          conekta.com
          stpmex.com
          clara.com
          belvo.com
          kushki.com
          finsus.com
          cubofinanciero.com
          alestra.com.mx
          kio.tech
          totalplayempresarial.com.mx
          triara.com
          scitum.com.mx
          mcmtelecom.com
          megacable.com.mx
          izzi.mx
          uninet.com.mx
          axtel.com.mx
          bind.com.mx
          facturama.mx
          alegra.com
          skydropx.com
          clicoh.com
          aspel.com
          intelisis.com
          contpaqi.com
          enkontrol.com
          odoo.com
          softtek.com
          neoris.com
          logicalis.com
          dxc.com
          nubiral.com
          mainbit.com.mx
          compucad.com.mx
          iqsec.com.mx
          telmex.com
          deloitte.com
          kpmg.com
          hospitalesmac.com
          christusmuguerza.com.mx
          cetys.mx
          anahuac.mx
          up.edu.mx
          superjusto.com
          galex.com.mx
          tracsa.com.mx
          EOF

      - name: Run real PRAETOR batch scanner
        run: |
          python praetor_batch_scanner.py --domains dominios_nuevos.txt --out-dir PRAETOR_50_NUEVOS --workers 8 --timeout 10

      - name: Upload real scan results
        uses: actions/upload-artifact@v4
        with:
          name: PRAETOR-50-NUEVOS-RESULTADOS
          path: PRAETOR_50_NUEVOS/
          if-no-files-found: error
          retention-days: 14

      - name: Show scan summary
        run: |
          find PRAETOR_50_NUEVOS -maxdepth 2 -type f -print
          echo '--- SUMMARY ---'
          cat PRAETOR_50_NUEVOS/summary/* 2>/dev/null || true
