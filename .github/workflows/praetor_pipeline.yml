name: Praetor Intelligence Core Pipeline

on:
  workflow_dispatch:

jobs:
  run-pipeline:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Código Fuente
      uses: actions/checkout@v4
      with:
        ref: praetor/fix-workflow

    - name: Configurar Entorno Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'

    - name: Instalar Dependencias del Sistema y Playwright
      run: |
        python -m pip install --upgrade pip
        pip install playwright
        python -m playwright install chromium
        python -m playwright install-deps chromium

    - name: Run Core Verification (ensure CSV exists)
      run: |
        echo "[+] Asegurando results/checked_domains.csv"
        mkdir -p results
        if [ ! -f results/checked_domains.csv ]; then
          echo "google.com" > results/checked_domains.csv
          echo "github.com" >> results/checked_domains.csv
        fi

    - name: Execute Screenshot Automation Step
      run: |
        python scripts/praetor_screenshot.py

    - name: Upload Praetor Operational Artifacts
      uses: actions/upload-artifact@v4
      with:
        name: praetor-results
        path: |
          results/
          captures/
        if-no-files-found: warn
        retention-days: 7
