# cd C:\ruta\a\tu\repo\praetor-intelligence

# 2) Traer refs remotas y preparar rama local a partir de la remota si existe
git fetch origin
git rev-parse --verify origin/praetor/fix-workflow 2>$null
if ($LASTEXITCODE -eq 0) {
  git checkout -B praetor/fix-workflow origin/praetor/fix-workflow
} else {
  git checkout -B praetor/fix-workflow
}

# 3) Sobrescribir workflow corregido (sube artifacts en vez de push y añade debug)
if (-not (Test-Path -Path ".github\workflows")) { New-Item -ItemType Directory -Path ".github\workflows" | Out-Null }
@'
name: Praetor Intelligence Core Pipeline

on:
  workflow_dispatch:

jobs:
  run-pipeline:
    runs-on: ubuntu-latest
    env:
      STRIPE_SECRET_KEY: ${{ secrets.STRIPE_SECRET_KEY }}
      STRIPE_WEBHOOK_SECRET: ${{ secrets.STRIPE_WEBHOOK_SECRET }}
      SMTP_USER: ${{ secrets.SMTP_USER }}
      SMTP_PASSWORD: ${{ secrets.SMTP_PASSWORD }}
      DATABASE_URL: ${{ secrets.DATABASE_URL }}

    steps:
    - name: Checkout Código Fuente
      uses: actions/checkout@v4

    - name: Configurar Entorno Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'

    - name: Instalar Dependencias del Sistema y Python
      run: |
        python -m pip install --upgrade pip
        pip install playwright dnspython pandas
        python -m playwright install chromium

    - name: Ejecutar Verificación DNS en Lote
      run: |
        if [ -f "scripts/check_dns_batch.py" ]; then
          python scripts/check_dns_batch.py campaigns/PIPELINE_ENSENADA.csv campaigns/PIPELINE_ENSENADA_checked.csv
        else
          echo "scripts/check_dns_batch.py no encontrado, omitiendo paso."
          # Create an empty output so artifact step won't fail
          python - <<'PY'
import pandas as pd
pd.DataFrame([], columns=['dominio','DMARC','MX','SPF','checked_at']).to_csv('campaigns/PIPELINE_ENSENADA_checked.csv', index=False)
PY
        fi

    - name: Procesar Capturas de Pantalla Automatizadas
      run: |
        mkdir -p captures
        if [ -f "campaigns/PIPELINE_ENSENADA.csv" ]; then
          tail -n +2 campaigns/PIPELINE_ENSENADA.csv | while IFS=',' read -r empresa giro dominio resto; do
            dom=$(echo "$dominio" | tr -d '\r' | xargs)
            if [ ! -z "$dom" ]; then
              python scripts/praetor_screenshot.py "$dom" || true
            fi
          done
        else
          echo "campaigns/PIPELINE_ENSENADA.csv not found, skipping screenshots."
        fi

    - name: Debug - listar resultados
      run: |
        echo "PWD: $(pwd)"
        echo "Campaigns dir:"
        ls -la campaigns || true
        echo "Captures dir:"
        ls -la captures || true

    - name: Upload results as artifact
      uses: actions/upload-artifact@v4
      with:
        name: praetor-results
        path: |
          campaigns/PIPELINE_ENSENADA_checked.csv
          captures/
'@ > .github\workflows\praetor_pipeline.yml

# 4) Crear/actualizar scripts
if (-not (Test-Path -Path "scripts")) { New-Item -ItemType Directory -Path "scripts" | Out-Null }

@'
# scripts/praetor_screenshot.py
import sys, os, time
from playwright.sync_api import sync_playwright

def capture_site(domain, retries=2, timeout=45000):
    if not domain.startswith('http'):
        url = f"https://{domain}"
    else:
        url = domain
        domain = domain.replace('https://','').replace('http://','').split('/')[0]

    output_dir = "captures"
    os.makedirs(output_dir, exist_ok=True)
    output_path = os.path.join(output_dir, f"{domain}.png")

    print(f"[+] Iniciando captura para: {url}")
    with sync_playwright() as p:
        browser = p.chromium.launch(headless=True)
        context = browser.new_context(ignore_https_errors=True)
        page = context.new_page()
        attempt = 0
        while attempt <= retries:
            try:
                page.set_viewport_size({"width":1280,"height":800})
                page.goto(url, wait_until="domcontentloaded", timeout=timeout)
                page.screenshot(path=output_path, full_page=True)
                print(f"[✔] Captura guardada con éxito en: {output_path}")
                break
            except Exception as e:
                attempt += 1
                print(f"[✘] Error al capturar {url} (intento {attempt}/{retries}): {e}")
                if attempt > retries:
                    print(f"[✘] Saltando {url} tras {retries} reintentos.")
                else:
                    time.sleep(2)
        try:
            context.close()
            browser.close()
        except Exception:
            pass

if __name__ == "__main__":
    if len(sys.argv) < 2:
        print("Uso: python praetor_screenshot.py <dominio.com>")
        sys.exit(1)
    capture_site(sys.argv[1])
'@ > scripts\praetor_screenshot.py

@'
# scripts/check_dns_batch.py
import dns.resolver
import pandas as pd
import sys, os
from datetime import datetime

def has_dmarc(domain):
    try:
        answers = dns.resolver.resolve('_dmarc.'+domain, 'TXT', lifetime=5)
        for r in answers:
            txt = ''.join([s.decode() if isinstance(s, bytes) else str(s) for s in getattr(r,'strings',[r])])
            if 'v=DMARC1' in txt.upper():
                return True, txt
    except Exception:
        return False, ''
    return False, ''

def has_mx(domain):
    try:
        answers = dns.resolver.resolve(domain, 'MX', lifetime=5)
        return len(answers) > 0
    except Exception:
        return False

def get_spf(domain):
    try:
        answers = dns.resolver.resolve(domain, 'TXT', lifetime=5)
        for r in answers:
            txt = ''.join([s.decode() if isinstance(s, bytes) else str(s) for s in getattr(r,'strings',[r])])
            if txt.strip().lower().startswith('v=spf1'):
                return True, txt
    except Exception:
        return False, ''
    return False, ''

def process(input_csv, output_csv):
    if not os.path.exists(input_csv):
        print(f"[!] Input CSV not found: {input_csv}. Creating empty output CSV.")
        pd.DataFrame([], columns=['dominio','DMARC','MX','SPF','checked_at']).to_csv(output_csv, index=False)
        return
    df = pd.read_csv(input_csv)
    rows = []
    for _, r in df.iterrows():
        # attempt several column names for domain
        if 'dominio' in r:
            domain = r.get('dominio')
        elif 'domain' in r:
            domain = r.get('domain')
        else:
            domain = r.iloc[0]
        domain = str(domain).strip()
        dmarc, _ = has_dmarc(domain)
        mx = has_mx(domain)
        spf, _ = get_spf(domain)
        r['DMARC'] = 'SI' if dmarc else 'NO'
        r['MX'] = 'SI' if mx else 'NO'
        r['SPF'] = 'SI' if spf else 'NO'
        r['checked_at'] = datetime.utcnow().isoformat()
        rows.append(r)
    out = pd.DataFrame(rows)
    out.to_csv(output_csv, index=False)
    print("Saved:", output_csv)

if __name__ == "__main__":
    if len(sys.argv) < 3:
        print("Uso: python scripts/check_dns_batch.py input.csv output.csv")
        sys.exit(1)
    process(sys.argv[1], sys.argv[2])
'@ > scripts\check_dns_batch.py

