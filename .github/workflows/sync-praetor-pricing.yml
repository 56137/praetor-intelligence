name: Sync PRAETOR pricing

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  sync-pricing:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Normalize pricing in landing pages and backend
        shell: python
        run: |
          from pathlib import Path
          import re

          # Single source of truth for the commercial plans.
          PRICES = {
              'express': 190000,
              'pro': 690000,
              'corporate': 2490000,
              'monitoring': 390000,
          }

          def patch_landing(path: Path):
              if not path.exists():
                  return False
              text = path.read_text(encoding='utf-8')
              original = text

              # Keep the public landing page aligned with the authoritative pricing.
              replacements = {
                  '$99 <small>MXN / reporte</small>': '$1,900 <small>MXN / reporte</small>',
                  '$2,999 <small>MXN / reporte</small>': '$1,900 <small>MXN / reporte</small>',
                  '$1,900 <small>MXN / reporte</small>': '$1,900 <small>MXN / reporte</small>',
                  '$399 <small>MXN / reporte</small>': '$6,900 <small>MXN / reporte</small>',
                  '$6,999 <small>MXN / reporte</small>': '$6,900 <small>MXN / reporte</small>',
                  '$6,900 <small>MXN / reporte</small>': '$6,900 <small>MXN / reporte</small>',
                  '$24,900 <small>MXN / desde</small>': '$24,900 <small>MXN / reporte</small>',
                  '$10,999 <small>MXN / reporte</small>': '$24,900 <small>MXN / reporte</small>',
                  '$24,900 <small>MXN / reporte</small>': '$24,900 <small>MXN / reporte</small>',
                  '$3,999 <small>MXN / mes</small>': '$3,900 <small>MXN / mes</small>',
                  '$3,900 <small>MXN / mes</small>': '$3,900 <small>MXN / mes</small>',
                  'DESCARGAR REPORTE COMPLETO — $99 MXN': 'DESCARGAR REPORTE COMPLETO — $1,900 MXN',
                  'DESCARGAR REPORTE COMPLETO — $2,999 MXN': 'DESCARGAR REPORTE COMPLETO — $1,900 MXN',
              }
              for old, new in replacements.items():
                  text = text.replace(old, new)

              # Normalize client-side checkout amounts.
              text = text.replace("buyReport('express',9900)", "buyReport('express',190000)")
              text = text.replace("buyReport('express',299900)", "buyReport('express',190000)")
              text = text.replace("buyReport('pro',39900)", "buyReport('pro',690000)")
              text = text.replace("buyReport('pro',699900)", "buyReport('pro',690000)")
              text = text.replace("buyReport('corporate',1099900)", "buyReport('corporate',2490000)")
              text = text.replace("buyReport('corporate',2490000)", "buyReport('corporate',2490000)")

              # Add monitoring to older landing variants when needed.
              if 'startMonitoring' not in text:
                  marker = '''      <div class="tier">\n        <div class="tag">PRÓXIMAMENTE</div>'''
                  if marker in text:
                      monitoring = '''      <div class="tier">\n        <div class="tag">RECURRENTE</div>\n        <h3>Vigilancia</h3>\n        <div class="price">$3,900 <small>MXN / mes</small></div>\n        <ul>\n          <li>Reescaneo mensual automático</li>\n          <li>Alerta ante cambios de configuración</li>\n          <li>Nuevos subdominios y CVEs detectados</li>\n          <li>Informe comparativo mes a mes</li>\n          <li>Prioridad en soporte</li>\n        </ul>\n        <button class="btn btn-ghost" onclick="startMonitoring()">Activar monitoreo</button>\n      </div>\n'''
                      text = text.replace(marker, monitoring + marker, 1)
                      text = text.replace('</script>\n</body>', '''function startMonitoring(){\n  if(!lastDomain){ alert('Primero escanea un dominio.'); return; }\n  if(!lastEmail || !/^[^\\s@]+@[^\\s@]+\\.[^\\s@]+$/.test(lastEmail)){\n    const e=(prompt('Escribe un correo válido para el monitoreo:')||'').trim();\n    if(!/^[^\\s@]+@[^\\s@]+\\.[^\\s@]+$/.test(e)){ alert('Correo inválido.'); return; }\n    lastEmail=e;\n  }\n  buyReport('monitoring',390000);\n}\n</script>\n</body>''', 1)

              if text != original:
                  path.write_text(text, encoding='utf-8')
                  return True
              return False

          changed = False
          for name in ['landing.html', 'en/index.html']:
              changed |= patch_landing(Path(name))

          app = Path('app.py')
          if app.exists():
              text = app.read_text(encoding='utf-8-sig')
              original = text

              # Never trust a client-supplied amount. Price is selected server-side by plan.
              text = text.replace(
                  "price_amount = data.get('price', 100)\n        plan = data.get('plan', 'express')",
                  "plan = str(data.get('plan', 'express')).lower()\n        plan_prices = {'express': 190000, 'pro': 690000, 'corporate': 2490000, 'monitoring': 390000}\n        if plan not in plan_prices:\n            return jsonify({'error': 'Plan no válido'}), 400\n        price_amount = plan_prices[plan]"
              )
              text = text.replace(
                  "'unit_amount': price_amount,\n                },",
                  "'unit_amount': price_amount,\n                    **({'recurring': {'interval': 'month'}} if plan == 'monitoring' else {}),\n                },"
              )
              text = text.replace(
                  "mode='payment',",
                  "mode=('subscription' if plan == 'monitoring' else 'payment'),",
                  1
              )

              # Do not generate a one-off PDF on subscription creation.
              needle = "        if event['type'] == 'checkout.session.completed':\n        "
              # Preserve the existing webhook flow; monitoring can be handled separately.

              if text != original:
                  app.write_text(text, encoding='utf-8')
                  changed = True

          if changed:
              print('Pricing synchronization applied.')
          else:
              print('No pricing changes needed.')

      - name: Commit synchronized pricing
        shell: bash
        run: |
          if git diff --quiet; then
            echo 'No changes to commit.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add landing.html en/index.html app.py
          git commit -m 'fix: synchronize PRAETOR pricing'
          git push
