name: Alignerr Audit Readiness

on:
  push:
    branches:
      - alignerr-audit-readiness
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt pytest
      - name: Compile application modules
        run: python -m compileall -q app.py seo_server.py scan_target.py monitor.py
      - name: Run security regression tests
        env:
          ADMIN_TOKEN: ""
          STRIPE_SECRET_KEY: ""
          STRIPE_WEBHOOK_SECRET: ""
          CRON_SECRET: ""
        run: python -m pytest -q
