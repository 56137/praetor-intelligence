name: Praetor Pipeline Final

on:
  workflow_dispatch:
  schedule:
    - cron: '0 0 * * *'

jobs:
  run-pipeline:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout
      uses: actions/checkout@v4

    - name: Configurar Python
      uses: actions/setup-python@v5
      with:
        python-version: "3.11"

    - name: Instalar dependencias del sistema
      run: |
        sudo apt-get update
        sudo apt-get install -y \
          libnss3 libatk1.0-0 libatk-bridge2.0-0 libcups2 \
          libxcomposite1 libxrandr2 libxdamage1 libxss1 \
          libgtk-3-0 libgbm1 libasound2t64 fonts-liberation

    - name: Instalar dependencias de Python y Playwright
      run: |
        python -m pip install --upgrade pip
        pip install playwright dnspython pandas
        python -m playwright install chromium
        playwright install-deps chromium

    - name: Ejecutar Verificación DNS en Lote
      run: |
        if [ -f "scripts/check_dns_batch.py" ]; then
          python scripts/check_dns_batch.py campaigns/PIPELINE_ENSENADA.csv campaigns/PIPELINE_ENSENADA_checked.csv
        else
          echo "scripts/check_dns_batch.py no encontrado, omitiendo paso."
          python - <<'PY'
        import pandas as pd
        pd.DataFrame([], columns=['dominio','DMARC','MX','SPF','checked_at']).to_csv('campaigns/PIPELINE_ENSENADA_checked.csv', index=False)
        PY
        fi

    - name: Procesar Capturas de Pantalla Automatizadas
      run: |
        mkdir -p captures
        if [ -f "campaigns/PIPELINE_ENSENADA.csv" ]; then
          tail -n +2 campaigns/PIPELINE_ENSENADA.csv | while IFS=',' read -r empresa giro dominio resto; do
            dom=$(echo "$dominio" | tr -d '\r' | xargs)
            if [ ! -z "$dom" ]; then
              python scripts/praetor_screenshot.py "$dom" || true
            fi
          done
        else
          echo "campaigns/PIPELINE_ENSENADA.csv not found, skipping screenshots."
        fi

    - name: Debug - listar resultados
      run: |
        echo "PWD: $(pwd)"
        echo "Campaigns dir:"
        ls -la campaigns || true
        echo "Captures dir:"
        ls -la captures || true

    - name: Upload results as artifact
      uses: actions/upload-artifact@v4
      with:
        name: praetor-results
        path: |
          campaigns/PIPELINE_ENSENADA_checked.csv
          captures/
        if-no-files-found: warn
        retention-days: 7
        
