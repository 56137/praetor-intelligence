<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>PRAETOR - Descarga tu Reporte</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background: #0a0a0a;
            color: #fff;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
        }
        .box {
            text-align: center;
            background: #1a1a1a;
            padding: 40px;
            border-radius: 12px;
            border: 1px solid #00d4ff;
            max-width: 500px;
        }
        h1 { color: #00d4ff; }
        .btn {
            background: #00d4ff;
            color: #000;
            border: none;
            padding: 14px 35px;
            font-size: 18px;
            font-weight: bold;
            border-radius: 8px;
            cursor: pointer;
            text-decoration: none;
            display: inline-block;
        }
        .btn:hover {
            background: #00e5ff;
            transform: scale(1.05);
        }
        .info { color: #666; font-size: 14px; margin-top: 15px; }
        .loading {
            display: inline-block;
            width: 18px;
            height: 18px;
            border: 3px solid #333;
            border-top: 3px solid #00d4ff;
            border-radius: 50%;
            animation: spin 1s linear infinite;
            vertical-align: middle;
            margin-right: 10px;
        }
        @keyframes spin { to { transform: rotate(360deg); } }
    </style>
</head>
<body>
    <div class="box">
        <h1>✅ ¡PAGO CONFIRMADO!</h1>
        <p style="color:#888;">Tu reporte está listo para descargar</p>
        
        <div id="downloadSection">
            <button class="btn" onclick="startDownload()">
                📥 DESCARGAR REPORTE
            </button>
            <p class="info">También recibirás una copia por correo electrónico</p>
        </div>

        <div id="loadingSection" style="display:none;">
            <p><span class="loading"></span> Preparando descarga...</p>
        </div>
    </div>

    <script>
        function startDownload() {
            const reportId = '{{ report_id }}';
            document.getElementById('downloadSection').style.display = 'none';
            document.getElementById('loadingSection').style.display = 'block';
            
            setTimeout(() => {
                window.location.href = '/download/' + reportId;
            }, 500);
        }

        // Descarga automática al cargar
        setTimeout(startDownload, 1000);
    </script>
</body>
</html>
